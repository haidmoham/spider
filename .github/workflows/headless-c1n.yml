name: Headless C-1N

on:
  pull_request:
  push:
    branches: [master]

jobs:
  headless-c1n:
    name: Headless C-1N simulation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install runtime and plotting test dependencies
        run: python -m pip install -r requirements.txt matplotlib
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run deterministic regression suite
        run: python -m unittest discover -s tests -v
      - name: Run static baseline
        run: python -m c1n run --headless --experiment none --seconds 1
      - name: Run canonical live path headlessly
        run: python -m c1n run --headless --seconds 1
      - name: Run legacy SHUFFLE headlessly
        run: python -m c1n run --headless --experiment shuffle --seconds 2
